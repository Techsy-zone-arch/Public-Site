<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الذكي الفاخر</title>
    <!-- Tailwind CSS للتصميم الجذاب والسريع -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- شريط التنقل -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-indigo-6xl text-indigo-600">✨ متجري</a>
            <div class="space-x-4 space-x-reverse">
                <a href="#" class="text-gray-600 hover:text-indigo-6xl hover:text-indigo-600">الرئيسية</a>
                <a href="#" class="text-gray-600 hover:text-indigo-6xl hover:text-indigo-600">المنتجات</a>
            </div>
        </div>
    </nav>

    <!-- غلاف المتجر الرئيسي (Hero Section) -->
    <header class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-20 px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-bold mb-4">اكتشف أفضل المنتجات العصرية</h1>
        <p class="text-xl opacity-90 mb-8">جودة عالية، أسعار تنافسية، وتوصيل سريع حتى باب بيتك</p>
        <a href="#products" class="bg-white text-indigo-600 font-bold px-8 py-3 rounded-full shadow-lg hover:bg-gray-100 transition">تسوق الآن</a>
    </header>

    <!-- قسم المنتجات -->
    <main id="products" class="max-w-6xl mx-auto px-4 py-16">
        <h2 class="text-3xl font-bold text-center mb-12">منتجاتنا المميزة</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            {% for product in products %}
            <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 flex flex-col justify-between">
                <img src="{{ product.image }}" alt="{{ product.name }}" class="w-full h-64 object-cover">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xl font-bold text-gray-900">{{ product.name }}</h3>
                        <span class="text-xl font-extrabold text-indigo-6xl text-indigo-600">{{ product.price }}</span>
                    </div>
                    <p class="text-gray-600 text-sm mb-6 leading-relaxed">{{ product.desc }}</p>
                    <button onclick="alert('تمت الإضافة للسلة! (يمكنك ربط هذا بزر واتساب أو بوابات دفع)')" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">إضافة إلى السلة 🛒</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-gray-900 text-gray-400 py-8 text-center border-t border-gray-800">
        <p>© 2026 جميع الحقوق محفوظة لمتجري الإلكتروني</p>
    </footer>

</body>
</html>
